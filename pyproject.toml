[project]
name = "threat-intel-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicola García Echavarría", email = "168017368+NicolaGarciaE@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.6",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.13.1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Only resolve distributions uploaded at least 2 weeks before the session
# that added them (CLAUDE.md §3). Bump explicitly when adding packages.
exclude-newer = "2026-10-12T00:00:00Z"
# The same uv everywhere: uv refuses to run with another version, and
# astral-sh/setup-uv installs this one in Actions (CLAUDE.md §3).
required-version = "==0.13.0"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.17.0",
]
